services:
  deployguard:
    image: ${DEPLOYGUARD_IMAGE:?Set DEPLOYGUARD_IMAGE to the GHCR image reference}
    container_name: deployguard
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${DEPLOYGUARD_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /tmp:size=16m,mode=1777
      - /var/run:size=1m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
          pids: 100
